<svg width="1800" height="1040" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <defs>
    <symbol id="drone" viewBox="-30 -14 60 24" overflow="visible">
      <line x1="-26" y1="-10" x2="-6" y2="-10" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="-10" x2="26" y2="-10" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
      <line x1="-16" y1="-8" x2="-16" y2="-2" stroke="#9ca3af" stroke-width="2"/>
      <line x1="16" y1="-8" x2="16" y2="-2" stroke="#9ca3af" stroke-width="2"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
      <rect x="-9" y="-5" width="18" height="10" rx="3" fill="#4b5563" stroke="#d1d5db" stroke-width="1"/>
    </symbol>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="10" fill="#1f2937"/>
  <rect width="900" height="520" rx="10" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- ground -->
  <line x1="20" y1="450" x2="880" y2="450" stroke="rgba(255,255,255,0.25)"/>

  <!-- tree -->
  <ellipse cx="400" cy="215" rx="140" ry="120" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.25)"/>
  <path d="M392,450 L396,250 L404,250 L408,450 z" fill="#57534e"/>
  <path d="M400,300 L340,250 M400,280 L455,235 M400,255 L370,200" stroke="#57534e" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- target branch, seen end-on -->
  <circle cx="455" cy="232" r="8" fill="#a8a29e" stroke="#f9fafb" stroke-width="2"/>
  <text x="472" y="264" font-size="12" font-weight="600" fill="#f9fafb">Target branch</text>

  <!-- operator with rod -->
  <circle cx="88" cy="388" r="9" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <path d="M88,397 L88,425 M88,425 L78,450 M88,425 L98,450 M88,405 L112,414" stroke="#d1d5db" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="104" y1="420" x2="160" y2="372" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>

  <!-- flight path -->
  <path d="M150,440 C170,260 300,92 450,80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <path d="M460,80 L710,80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <path d="M730,96 C715,120 630,140 620,190 L620,428" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <!-- line state while dragging (step 3) -->
  <path d="M164,370 C260,330 380,250 451,224" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <path d="M459,224 C540,205 640,182 698,170" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="730" y1="88" x2="698" y2="168" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="698" cy="168" r="4" fill="#fb923c"/>

  <!-- drones -->
  <use href="#drone" x="700" y="70" width="60" height="24"/>
  <g opacity="0.45"><use href="#drone" x="590" y="428" width="60" height="24"/></g>

  <!-- step markers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="236" cy="190" r="12" fill="#38bdf8"/><text x="236" y="195" fill="#0f172a">1</text>
    <circle cx="590" cy="60" r="12" fill="#38bdf8"/><text x="590" y="65" fill="#0f172a">2</text>
    <circle cx="785" cy="80" r="12" fill="#38bdf8"/><text x="785" y="85" fill="#0f172a">3</text>
    <circle cx="647" cy="330" r="12" fill="#38bdf8"/><text x="647" y="335" fill="#0f172a">4</text>
  </g>

  <!-- step labels -->
  <g font-size="12" fill="#9ca3af">
    <text x="60" y="160" font-weight="600" font-size="13" fill="#f9fafb">Climb above the branch</text>
    <text x="60" y="176">Get well clear of the canopy first</text>

    <text x="450" y="34" font-weight="600" font-size="13" fill="#f9fafb">Drag through horizontally, well above</text>
    <text x="450" y="50">Fly past the branch in your intended direction</text>

    <text x="770" y="114" font-weight="600" font-size="13" fill="#f9fafb">Keep going</text>
    <text x="770" y="130">until there is</text>
    <text x="770" y="145">enough slack to</text>
    <text x="770" y="160">reach the ground</text>

    <text x="665" y="306" font-weight="600" font-size="13" fill="#f9fafb">Ease back, then descend</text>
    <text x="665" y="322">Move back closer to the</text>
    <text x="665" y="337">branch and come straight</text>
    <text x="665" y="352">down with slack in the line</text>
  </g>

  <!-- orange angle callout -->
  <line x1="672" y1="128" x2="708" y2="128" stroke="rgba(255,255,255,0.3)"/>
  <text x="420" y="116" font-size="12" font-weight="700" fill="#fb923c">Watch the orange cord's angle</text>
  <text x="420" y="132" font-size="12" fill="#9ca3af">The harder it trails back toward the</text>
  <text x="420" y="147" font-size="12" fill="#9ca3af">tree, the closer you are to your limit.</text>
  <text x="420" y="162" font-size="12" fill="#9ca3af">Go higher.</text>

  <!-- legend -->
  <g font-size="12" fill="#e5e7eb">
    <line x1="190" y1="478" x2="220" y2="478" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="228" y="482">drone path</text>
    <line x1="340" y1="478" x2="370" y2="478" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <text x="378" y="482">orange lead</text>
    <line x1="490" y1="478" x2="520" y2="478" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="528" y="482">braided line from the rod</text>
  </g>
  <text x="450" y="504" text-anchor="middle" font-size="12" fill="#9ca3af">Line shown as it lies at step 3: up from the rod, over the branch, and back up to the drone</text>
</svg>
